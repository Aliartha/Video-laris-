<!DOCTYPE html>
<html>
<head>
  <title>VideoLaris AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      color: #ccc;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: white;
      font-size: 16px;
    }

    video {
      width: 100%;
      margin-top: 15px;
      border-radius: 10px;
    }

    .mode button {
      width: 30%;
      margin: 5px;
      background: #1e293b;
    }
  </style>
</head>

<body>

<div class="container">

<h1>🎥 VideoLaris AI</h1>
<p>Bikin video jualan otomatis dalam 1 klik</p>

<div class="mode">
  <button onclick="setMode('ads')">🛍️ Jualan</button>
  <button onclick="setMode('cinematic')">🎬 Cinematic</button>
  <button onclick="setMode('viral')">🔥 Viral</button>
</div>

<input id="prompt" placeholder="Contoh: produk skincare glowing..." />

<button onclick="generate()">🚀 Buat Video</button>

<p id="status"></p>

<video id="video" controls></video>

</div>

<script>
let mode = "ads";

function setMode(m) {
  mode = m;
}

function generate() {
  document.getElementById("status").innerText = "Memproses...";

  setTimeout(() => {
    document.getElementById("video").src =
      "https://www.w3schools.com/html/mov_bbb.mp4";
    document.getElementById("status").innerText = "Selesai!";
  }, 2000);
}
</script>

</body>
</html>
